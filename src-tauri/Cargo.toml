[package]
name = "stillenough"
version = "0.4.4"
description = "Windows desktop monitor for AI subscription quotas and API balances"
authors = ["StillEnough contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stillenough_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
embed-resource = "3"
tauri-build = { version = "2", features = [] }

[dependencies]
stillenough-core = { path = "../crates/stillenough-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "system-proxy", "socks"] }
keyring = { version = "3", features = ["windows-native"] }
zeroize = "1"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["time", "sync", "macros", "process", "io-util"] }


[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
